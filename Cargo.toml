[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/net",
    "crates/platform",
    "crates/app",
    "crates/registry",
    "crates/tray",
    "crates/flow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
sha2 = "0.10"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
ureq = { version = "2", features = ["tls", "json"] }
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
if-addrs = "0.15"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# Windows
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# Linux
evdev = "0.12"
