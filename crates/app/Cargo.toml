[package]
name = "kbshare"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kbshare"
path = "src/main.rs"

[dependencies]
kbshare-core = { path = "../core" }
kbshare-net = { path = "../net" }
kbshare-platform = { path = "../platform" }
kbshare-tray = { path = "../tray" }
kbshare-flow = { path = "../flow" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
clipboard-rs = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }

crossbeam-channel = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
libc = "0.2"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

windows-core = "0.59"
